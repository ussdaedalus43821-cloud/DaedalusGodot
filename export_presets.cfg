; Export presets for Daedalus.
;
; The include_filter lines are the important part: .nova files are not
; Godot resources, so without them they are silently dropped from the .pck
; and the exported build ships with no ship stats, no enemy AI and no
; weapons logic at all. Every preset ships scripts_nova/*.nova -- the
; interpreter is GDScript (scripts/nova/) and reads them from res:// on
; every platform, which is why all the presets are the same shape. There
; is no Python in this project.
;
; Desktop (Windows/macOS/Linux) is the release target -- Windows and Linux
; embed their .pck so a player gets one file to run. There is deliberately
; no Web preset: Daedalus ships as a download, not a browser game.
;
; macOS uses Godot's built-in ad-hoc signing (codesign=1). That is not a
; Developer ID signature, so Gatekeeper still asks players to approve the
; app once, but with no signature at all the arm64 half of the universal
; binary will not launch on Apple Silicon.

[preset.0]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="scripts_nova/*.nova"
exclude_filter="docs/*, *.md"
export_path="../build/macos/Daedalus.app"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

